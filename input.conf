# =====================================================================
#  mpv-iina keybindings (Linux)
# =====================================================================

# ---------- iina_osc ----------
o            script-binding iina_osc/open-file     # open file dialog (zenity/kdialog/uosc)
Tab          script-binding iina_osc/toggle        # pin / unpin the controls
MBTN_RIGHT   script-binding iina_osc/menu          # main menu (uosc) outside the panel

# ---------- Zoom (video) ----------
Ctrl+=          script-binding iina_osc/zoom-in
Ctrl++          script-binding iina_osc/zoom-in
Ctrl+-          script-binding iina_osc/zoom-out
Ctrl+0          script-binding iina_osc/zoom-reset
Ctrl+WHEEL_UP   script-binding iina_osc/zoom-in
Ctrl+WHEEL_DOWN script-binding iina_osc/zoom-out
# Alt+arrows (mpv default) moves the zoomed picture

# ---------- Playback ----------
SPACE        cycle pause
MBTN_LEFT_DBL cycle fullscreen
LEFT         seek -5
RIGHT        seek  5
Shift+LEFT   seek -30
Shift+RIGHT  seek  30
,            frame-back-step
.            frame-step
[            multiply speed 1/1.1
]            multiply speed 1.1
BS           set speed 1
l            ab-loop
L            cycle-values loop-file inf no
n            playlist-next
N            playlist-prev

# ---------- Audio ----------
UP           add volume 5
DOWN         add volume -5
WHEEL_UP     add volume 2
WHEEL_DOWN   add volume -2
m            cycle mute
a            cycle audio

# ---------- Subtitles ----------
s            cycle sub
v            cycle sub-visibility
z            add sub-delay -0.1
x            add sub-delay  0.1
Shift+UP     add sub-scale  0.05
Shift+DOWN   add sub-scale -0.05

# ---------- Window ----------
f            cycle fullscreen
ESC          set fullscreen no
t            cycle ontop
Ctrl+s       screenshot video
i            script-binding stats/display-stats-toggle
q            quit
Q            quit-watch-later
