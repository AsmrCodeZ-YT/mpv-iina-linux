# =====================================================================
#  mpv-iina (Linux)  —  IINA look for mpv with the iina_osc.lua script
# =====================================================================

# ---------- UI (required) ----------
osc=no                     # turn off mpv's built-in OSC — iina_osc.lua replaces it
osd-bar=no                 # no old OSD bar; the panel shows progress
border=no                  # borderless window like IINA: the script draws the title + minimize/maximize/close buttons (top right)
                           # set border=yes if you prefer your desktop's title bar
idle=yes                   # keep the window open without a file (idle screen)
force-window=yes
keep-open=yes
cursor-autohide=1200

# ---------- Window ----------
geometry=50%:50%
autofit-larger=80%x80%
autofit-smaller=480x270
window-dragging=yes        # drag the window by clicking anywhere outside the panel

# ---------- Video ----------
vo=gpu-next
hwdec=auto-safe            # VAAPI / NVDEC / VDPAU when available
# profile=high-quality     # nicer scaling if you have a decent GPU
# video-sync=display-resample

# ---------- Audio ----------
volume=80
volume-max=150
audio-file-auto=fuzzy

# ---------- OSD messages ----------
osd-font="Inter"
osd-font-size=26
osd-border-size=1.2
osd-duration=1400
osd-playing-msg-duration=0

# ---------- Subtitles ----------
sub-auto=fuzzy
sub-font="Vazirmatn"       # good Persian font (sudo apt install fonts-vazirmatn), or "Noto Sans"
sub-font-size=44
sub-border-size=2.4
sub-shadow-offset=1
sub-codepage=cp1256        # old Persian/Arabic SRTs; UTF-8 files are still read as UTF-8
# slang=fa,per,fas,en,eng

# ---------- Resume (like IINA) ----------
save-position-on-quit=yes
watch-later-options-remove=sub-pos

# ---------- Screenshots ----------
screenshot-directory=~/Pictures
screenshot-format=png
screenshot-template="mpv-%F-%P"
