# =====================================================================
#  uosc in "menus only" mode — only needed if you install uosc.
#  iina-osc draws the controls; uosc only provides the menus/file browser.
# =====================================================================
disable_elements=window_border,top_bar,timeline,controls,volume,idle_indicator,audio_indicator,pause_indicator
progress=never
autohide=yes
menu_item_height=32
menu_min_width=300
menu_padding=6
border_radius=10
animation_duration=140
color=foreground=ffffff,foreground_text=1c1c1e,background=1c1c1e,background_text=f2f2f7,curtain=000000,success=30d158,error=ff453a,match=0a84ff
opacity=menu=0.94,submenu=0.5,curtain=0.35,tooltip=0.95,thumbnail=1
default_directory=~/Videos
