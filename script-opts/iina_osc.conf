# =====================================================================
#  iina_osc options — every line is optional (these are the defaults)
#  Colours are #RRGGBB, opacities 0..1, sizes in px before scaling
# =====================================================================

# ---- size
scale=1.0
scale_fullscreen=1.2
panel_width=640
panel_height=92
panel_margin=28
panel_radius=14

# ---- glass look
panel_color=#1E1E20
panel_opacity=0.72
border_color=#FFFFFF
border_opacity=0.12
shadow_opacity=0.35
foreground_color=#FFFFFF
accent_color=#FFFFFF          # e.g. #0A84FF for an Apple-blue seekbar
font=Inter
time_font_size=13

# ---- behaviour
hide_timeout=2000
fade_duration=180
keep_on_pause=no
show_on_seek=yes
show_on_start=yes
title_bar=auto                # auto | yes | no
window_buttons=yes            # yes (always) | windowed | auto (only with border=no) | no   — the  - [] x  buttons, top right
jump_seconds=10
quit_button=yes               # power button (right end): click = quit, right click = quit & remember position
zoom_buttons=yes              # zoom-out / zoom-in buttons next to the volume (right click = 100%)
zoom_step=0.1                 # log2 steps: 0.1 = about 7%, 0.25 = about 19%
zoom_min=-2                   # 25%
zoom_max=3                    # 800%
volume_max=100
exact_seek_on_release=yes
min_mouse_move=2

# ---- integrations
menu_backend=auto             # auto | uosc | select
thumbnails=yes                # needs thumbfast.lua in scripts/
